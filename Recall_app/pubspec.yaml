name: recall_app
description: "Recall - A spaced-repetition English vocabulary app for postgraduate entrance exams."
publish_to: 'none' # This package is not published to pub.dev.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  crypto: ^3.0.7
  flutter:
    sdk: flutter
  flutter_secure_storage: ^9.2.4
  http: ^1.5.0
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.3
  sqflite: ^2.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  sqflite_common_ffi: ^2.4.2
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/vocabulary/kaoyan_clean.json
